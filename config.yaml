# VidwaanAI Scripture Fine-Tuning Pipeline Configuration (Unsloth QLoRA)
# Optimized for 16GB VRAM (NVIDIA RTX 5060 Ti / CUDA 12.x/13.x)

model: "unsloth/Qwen2.5-1.5B-Instruct-bnb-4bit"
max_seq_length: 2048
load_in_4bit: true
data: "./data"

lora_parameters:
  rank: 16
  scale: 16.0
  dropout: 0.0 # Optimized to 0.0 for Unsloth fast kernels
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  batch_size: 2
  grad_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_train_epochs: 3
  max_steps: 50
  warmup_steps: 5
  weight_decay: 0.01
  grad_checkpoint: true
  random_seed: 3407
  output_dir: "./tmp_checkpoints"
  adapter_path: "./adapters"
  logging_steps: 5
  save_steps: 25
  eval_steps: 25
