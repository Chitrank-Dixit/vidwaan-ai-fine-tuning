[project]
name = "vidwaan-fine-tuning"
version = "0.2.0"
description = "VidwaanAI Scripture Fine-Tuning Pipeline powered by Unsloth QLoRA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "unsloth>=2024.8",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "datasets>=2.18.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "huggingface-hub>=0.20.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "llama.cpp", "fused_model", "tmp_checkpoints", "models", "bin", "unsloth_compiled_cache"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "llama.cpp",
    "fused_model",
    "tmp_checkpoints",
    "models",
    "bin",
    "unsloth_compiled_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
